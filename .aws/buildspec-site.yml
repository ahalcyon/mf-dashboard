version: 0.2

# S3 上の SQLite が更新されるたびに、その中身をビルド時に読み込んで
# 静的サイトを焼き直す。フロントは読み取り専用なので、実行時の DB 接続は持たない。

env:
  variables:
    # apps/web を作業ディレクトリとして next build が走るため、DB_PATH はそこからの相対パス
    DB_PATH: "../../data/moneyforward.db"
    # next.config.ts はこのフラグで output: "export" に切り替わる
    DEMO_MODE: "true"

phases:
  install:
    runtime-versions:
      nodejs: 22
    commands:
      - NODE_VERSION="$(cat .node-version)"
      - npm install -g n
      - n "$NODE_VERSION"
      - hash -r
      - node --version
      - corepack enable
      - corepack prepare "$(node -p "require('./package.json').packageManager")" --activate

  pre_build:
    commands:
      - mkdir -p data
      - aws s3 cp "s3://${DATA_BUCKET}/${DATABASE_OBJECT_KEY}" data/moneyforward.db
      # crawler の postinstall (playwright install chromium) を避けるため、
      # Dockerfile と同じく --ignore-scripts + rebuild --pending を使う
      - pnpm install --frozen-lockfile --filter "@mf-dashboard/web..." --ignore-scripts
      - pnpm rebuild --pending --filter "@mf-dashboard/web..."

  build:
    commands:
      - pnpm --filter @mf-dashboard/web build

  post_build:
    commands:
      - |
        aws s3 sync apps/web/out "s3://${SITE_BUCKET}" \
          --delete \
          --exclude "_next/static/*" \
          --cache-control "public, max-age=0, must-revalidate"
      - |
        aws s3 sync apps/web/out/_next/static "s3://${SITE_BUCKET}/_next/static" \
          --cache-control "public, max-age=31536000, immutable"
      - aws cloudfront create-invalidation --distribution-id "${DISTRIBUTION_ID}" --paths "/*"

cache:
  paths:
    - "/root/.local/share/pnpm/store/**/*"
    - "apps/web/.next/cache/**/*"
