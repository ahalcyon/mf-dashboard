name: Setup Node
description: Setup pnpm and Node.js with dependencies
inputs:
  browsers:
    description: >-
      Install the Chromium build Playwright drives. Only the job running the
      Storybook browser tests needs it: the E2E jobs use the browsers baked into
      the Playwright container image, and no other job launches one.
    default: "false"
runs:
  using: composite
  steps:
    # 既定は npm 経由の self-installer で、runner 同梱の v11.19.0 から
    # packageManager が指す版へ入れ替える。実測で 6.5 秒かかっていた。
    # standalone は単一バイナリを取ってくるだけで済む。
    - uses: pnpm/action-setup@v6.0.10
      with:
        standalone: true
    - uses: actions/setup-node@v7.0.0
      with:
        node-version-file: .node-version

    # 依存の解決結果そのものを持ち回る。ストアを復元しても pnpm install は
    # 525 パッケージ分のリンクを張り直すため、実測で 17 秒かかっていた。
    # node_modules を丸ごと戻せばその 17 秒が消える。
    #
    # 前方一致では復元しない。中途半端に古い依存木は、無いより悪い。
    # lockfile と workspace 定義が完全一致したときだけ使う。
    #
    # ホストのジョブと Playwright コンテナの e2e-web で同じキーを使う。分けると
    # 並行する 3 シャードが揃って外し、揃って約 300MB を保存し直す。実測では
    # その後処理だけで 40 秒かかっていた。どちらも linux/x64 の Ubuntu 24.04 で
    # Node も .node-version から同じものを入れるため、native build の ABI は
    # 揃う。食い違えば読み込み時に落ちるので、黙って壊れることはない。
    - id: modules
      uses: actions/cache@v6.1.0
      with:
        path: |
          node_modules
          apps/*/node_modules
          packages/*/node_modules
        key: >-
          node-modules-${{ runner.os }}-${{ runner.arch }}-${{
          hashFiles('pnpm-lock.yaml', 'pnpm-workspace.yaml', '.npmrc') }}

    # ここから下は node_modules を引き当てられなかったときの経路。
    # ストアは内容アドレスなので、前方一致で戻しても変わらなかった分は使える。
    - if: steps.modules.outputs.cache-hit != 'true'
      id: store
      run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"
      shell: bash

    - if: steps.modules.outputs.cache-hit != 'true'
      uses: actions/cache@v6.1.0
      with:
        path: ${{ steps.store.outputs.path }}
        key: pnpm-store-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
        restore-keys: pnpm-store-${{ runner.os }}-

    - if: steps.modules.outputs.cache-hit != 'true'
      run: pnpm install --frozen-lockfile
      shell: bash

    # 282MB あるので、ブラウザーを起動するジョブだけが復元する。
    # 取り違えても playwright が不足分を落とし直すだけなので前方一致で構わない。
    - if: inputs.browsers == 'true'
      uses: actions/cache@v6.1.0
      with:
        path: ~/.cache/ms-playwright
        key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
        restore-keys: playwright-${{ runner.os }}-

    - if: inputs.browsers == 'true'
      run: pnpm --filter @mf-dashboard/web exec playwright install chromium
      shell: bash
