name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main, new-release]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      # Storybook のテストは @vitest/browser-playwright で Chromium を起動する
      - uses: ./.github/actions/setup-node
        with:
          browsers: "true"
      # turbo のキャッシュ項目は入力のハッシュで引くため、古い版を復元しても
      # 入力が一致しないものは再実行される。前方一致で復元して構わない。
      - uses: actions/cache@v6.1.0
        with:
          path: .turbo/cache
          key: turbo-${{ runner.os }}-${{ github.job }}-${{ github.sha }}
          restore-keys: turbo-${{ runner.os }}-${{ github.job }}-
      - run: pnpm lint --format=github
      - run: pnpm format --check
      - run: pnpm knip
      - run: pnpm typecheck --affected
      - run: pnpm test --affected
  terraform:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: hashicorp/setup-terraform@v3.1.2
        with:
          terraform_version: 1.15.9
          terraform_wrapper: false
      - run: terraform fmt -check -recursive terraform
      # validate は認証情報を必要としないため、backend を初期化せずプロバイダーだけ取得する
      - run: terraform -chdir=terraform/aws init -backend=false -input=false
      - run: terraform -chdir=terraform/aws validate
      - run: terraform -chdir=terraform/aws/bootstrap init -backend=false -input=false
      - run: terraform -chdir=terraform/aws/bootstrap validate
  build-demo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: ./.github/actions/setup-node
      # turbo のキャッシュは張らない。build:demo は turbo.json で cache: false に
      # してあるため保存されるものが無く、実測でも 194 B しか積まれなかった。
      - run: pnpm build:demo --affected
      - run: pnpm --filter @mf-dashboard/db build:demo
      - run: pnpm --filter @mf-dashboard/db test:demo
  docker-build:
    name: Docker build (${{ matrix.app }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # terraform apply が push するイメージと同じものをビルドして壊れを検知する
        app: [crawler, writer, site-builder, refresh-trigger]
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - run: docker build -f docker/${{ matrix.app }}/Dockerfile .
  build-e2e-web:
    runs-on: ubuntu-latest
    env:
      DASHBOARD_URL: http://127.0.0.1:3000
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-node
      # turbo のキャッシュ項目は入力のハッシュで引くため、古い版を復元しても
      # 入力が一致しないものは再実行される。前方一致で復元して構わない。
      - uses: actions/cache@v6.1.0
        with:
          path: .turbo/cache
          key: turbo-${{ runner.os }}-${{ github.job }}-${{ github.sha }}
          restore-keys: turbo-${{ runner.os }}-${{ github.job }}-
      - run: DEMO_MODE=false pnpm --filter @mf-dashboard/web build
      - run: |
          cp -R apps/web/.next/static apps/web/.next/standalone/apps/web/.next/static
          cp -R apps/web/public apps/web/.next/standalone/apps/web/public
          tar -czf e2e-web-build.tar.gz -C apps/web/.next/standalone .
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: e2e-web-build
          path: e2e-web-build.tar.gz
          retention-days: 1
  e2e-web:
    needs: build-e2e-web
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: ["1/3", "2/3", "3/3"]
    container:
      image: mcr.microsoft.com/playwright:v1.62.1-noble
    env:
      PLAYWRIGHT_BROWSERS_PATH: /ms-playwright
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - uses: ./.github/actions/setup-node
      - uses: actions/download-artifact@v8.0.1
        with:
          name: e2e-web-build
          path: .artifacts
      - run: |
          mkdir -p apps/web/.next/standalone
          tar -xzf .artifacts/e2e-web-build.tar.gz -C apps/web/.next/standalone
      - run: pnpm test:e2e:web -- --shard=${{ matrix.shard }}
      - if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7.0.1
        with:
          name: playwright-blob-report-${{ strategy.job-index }}
          path: apps/web/blob-report/
          retention-days: 7

  merge-e2e-report:
    if: ${{ !cancelled() }}
    needs: e2e-web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-node
      - uses: actions/download-artifact@v8.0.1
        with:
          path: all-blob-reports
          pattern: playwright-blob-report-*
          merge-multiple: true
      - run: pnpm --filter @mf-dashboard/web exec playwright merge-reports --reporter html ../../all-blob-reports
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: playwright-report
          path: apps/web/playwright-report/
          retention-days: 7
